<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGJ Waarschuwingen</title>
    <meta name="theme-color" content="#154273">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="static/manifest.json">
    <link rel="icon" href="static/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="static/icon-192.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        igj: { 50: '#eff6ff', 100: '#dbeafe', 500: '#154273', 600: '#0f3460', 700: '#0a2647' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-igj-500 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="#/" class="flex items-center gap-3 hover:opacity-90">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 9v2m0 4h.01M12 3l9.09 16.91H2.91L12 3z"/>
                </svg>
                <div>
                    <h1 class="text-xl font-bold leading-tight">IGJ Waarschuwingen</h1>
                    <p class="text-xs text-blue-200">Medische hulpmiddelen &amp; apparatuur</p>
                </div>
            </a>
            <nav class="flex items-center gap-4">
                <a href="#/" class="text-sm hover:text-blue-200 transition">Home</a>
                <a href="#/archief/1" class="text-sm hover:text-blue-200 transition">Archief</a>
                <button type="button" id="refresh"
                        class="text-sm bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded transition"
                        title="Gegevens opnieuw laden">
                    &#x21bb; Ververs
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
        <div id="flash"></div>
        <div id="view"></div>
    </main>

    <footer class="bg-gray-100 border-t text-gray-500 text-xs py-4">
        <div class="max-w-6xl mx-auto px-4 flex justify-between">
            <span>Bron: <a href="https://www.igj.nl" class="underline hover:text-igj-500" target="_blank" rel="noopener">Inspectie Gezondheidszorg en Jeugd</a></span>
            <span id="updated"></span>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
