name: Update feed

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python scripts/build_data.py

      - name: Commit new warnings
        run: |
          if git diff --quiet -- data/warnings.json; then
            echo "Geen nieuwe waarschuwingen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/warnings.json
          git commit -m "Feed bijgewerkt"
          git push
